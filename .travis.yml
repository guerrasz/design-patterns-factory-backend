language: java
dist: jammy # Ubuntu 22.04, or 'noble' for 24.04

jdk:
  - openjdk24 # If available as a shortcut

# If 'openjdk24' is not yet in the shortcut list, use this manual install:
before_install:
  - sudo apt-get update
  - sudo apt-get install -y openjdk-24-jdk
  - export JAVA_HOME=/usr/lib/jvm/java-24-openjdk-amd64
  - export PATH=$JAVA_HOME/bin:$PATH

script:
  - ./mvnw clean install
